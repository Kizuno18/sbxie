name: Publish reviewed INI draft with user authentication

on:
  push:
    branches: [work/open-ini-pr-20260907]
    paths: ['.github/workflows/open-ini-pr-pat.yml']

permissions:
  contents: read

jobs:
  publish:
    if: github.repository == 'Kizuno18/sbxie' && github.actor == 'Kizuno18' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Generate a disposable authentication key
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out "$RUNNER_TEMP/ini-pr-key.pem" 2>/dev/null
          openssl pkey -in "$RUNNER_TEMP/ini-pr-key.pem" -pubout -out "$RUNNER_TEMP/ini-pr-public.pem"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ini-pr-public-${{ github.run_id }}
          path: ${{ runner.temp }}/ini-pr-public.pem
          retention-days: 1
      - name: Create only the authorized upstream draft
        shell: python
        env:
          READ_TOKEN: ${{ github.token }}
        run: |
          import base64, json, os, re, subprocess, time
          import urllib.request, urllib.parse, urllib.error
          from pathlib import Path

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          opener = urllib.request.build_opener(NoRedirect)
          key = Path(os.environ['RUNNER_TEMP']) / 'ini-pr-key.pem'
          result = {'created': False, 'expected_head': 'e68aa11696044066364af5d4d7cb537abca72ee9'}
          token = None
          stage = 'receive_authentication'
          branch = 'fix/ini-write-errors-20260907'
          pulls = '/repos/sandboxie-plus/Sandboxie/pulls'
          body = '''save errors could still end in a reload or a closed dialog, discarding the edits that had just failed to save

          this propagates failed INI list and boolean writes and keeps the sandbox options and raw INI editors open when saving fails

          - `CSbieIni::UpdateTextList` and `SetBoolSafe` stop at the first failed mutation instead of continuing and returning success
          - sandbox options stop apply/ok on reported write errors, without reloading over pending edits
          - raw INI save/apply/ok in both dialogs preserve the text, selection and undo history on failure, and the global editor rejects disconnected saves without attempting a write

          the structured sandbox view is invalidated before each raw write attempt because even a reported failure can leave partial changes — canceling afterward and returning to a structured tab reloads the current configuration instead of showing stale fields

          successful saves and explicit cancel keep their existing behavior — raw text still goes to the existing writer without reformatting comments, repeated keys or ordering

          the test targets contain 26 cases using real Qt containers and widgets with extracted production methods and injected storage failures, including partial progress, reconnect/retry and tab/tree navigation

          [earlier validation with Qt 5, Qt 6, Windows x64/MSVC and the real QSbieAPI/SandMan build](https://github.com/Kizuno18/sbxie/actions/runs/34137042949)

          that earlier run predates the additional partial-write cases — it is not evidence that those later cases were tested in that run

          this is not a transaction — earlier writes may already have succeeded, and there is no rollback or automatic retry — structured global settings still have unpropagated errors outside this change

          keeping this as a draft for real service/disk-failure checks before merge — the fixtures do not simulate a physical disk fault or run against SbieSvc'''
          body = '\n'.join(line[10:] if line.startswith('          ') else line for line in body.splitlines()).strip() + '\n'
          title = 'preserve pending edits when ini saves fail'

          def api(path, credential, method='GET', payload=None):
              if not path.startswith('/') or path.startswith('//') or method not in ('GET', 'POST'):
                  raise ValueError('Invalid request')
              if method == 'POST' and path != pulls:
                  raise ValueError('Write target not authorized')
              req = urllib.request.Request('https://api.github.com' + path,
                  data=None if payload is None else json.dumps(payload).encode('utf-8'),
                  headers={'Accept': 'application/vnd.github+json', 'Authorization': 'Bearer ' + credential,
                           'X-GitHub-Api-Version': '2022-11-28', 'Content-Type': 'application/json',
                           'User-Agent': 'sbxie-reviewed-pr-publication'}, method=method)
              try:
                  with opener.open(req, timeout=20) as response:
                      return response.status, json.load(response), dict(response.headers)
              except urllib.error.HTTPError as error:
                  try:
                      value = json.loads(error.read())
                  except ValueError:
                      value = {'message': 'Non-JSON API response'}
                  return error.code, value, dict(error.headers)

          def require(status, expected, data):
              if status != expected:
                  result.update(stage=stage, http_status=status, message=str(data.get('message', 'Request failed'))[:300])
                  raise RuntimeError('API request failed')

          try:
              ref = urllib.parse.quote('work/open-ini-pr-20260907', safe='')
              control_path = '/repos/Kizuno18/sbxie/contents/.github/ini-pr-auth-request.json?ref=' + ref
              deadline = time.monotonic() + 330
              while time.monotonic() < deadline:
                  status, item, _ = api(control_path, os.environ['READ_TOKEN'])
                  if status == 200:
                      control = json.loads(base64.b64decode(item['content']))
                      if str(control.get('run_id')) == os.environ['GITHUB_RUN_ID']:
                          break
                  elif status != 404:
                      require(status, 200, item)
                  time.sleep(4)
              else:
                  raise TimeoutError('Authentication channel expired')
              blob = control.get('sealed_blob_sha', '')
              if not re.fullmatch(r'[0-9a-f]{40}', blob):
                  raise ValueError('Invalid envelope reference')
              status, item, _ = api('/repos/Kizuno18/sbxie/git/blobs/' + blob, os.environ['READ_TOKEN'])
              require(status, 200, item)
              sealed = base64.b64decode(item['content'])
              if len(sealed) != 384:
                  raise ValueError('Invalid envelope length')
              clear = subprocess.run(['openssl', 'pkeyutl', '-decrypt', '-inkey', str(key),
                  '-pkeyopt', 'rsa_padding_mode:oaep', '-pkeyopt', 'rsa_oaep_md:sha256',
                  '-pkeyopt', 'rsa_mgf1_md:sha256'], input=sealed, capture_output=True, check=True).stdout
              envelope = json.loads(clear)
              if str(envelope.get('run_id')) != os.environ['GITHUB_RUN_ID']:
                  raise ValueError('Envelope belongs to another run')
              token = envelope['token']
              if not isinstance(token, str) or not re.fullmatch(r'[A-Za-z0-9_]{40,255}', token):
                  raise ValueError('Invalid token format')
              print('::add-mask::' + token, flush=True)
              del envelope, clear
              key.unlink()

              stage = 'authenticate_pat'
              status, user, _ = api('/user', token)
              require(status, 200, user)
              result['authenticated_login'] = user.get('login')
              if user.get('login', '').lower() != 'kizuno18':
                  raise ValueError('Unexpected account')

              stage = 'check_existing_pr'
              query = urllib.parse.urlencode({'state': 'all', 'head': 'Kizuno18:' + branch, 'per_page': 100})
              status, existing, _ = api(pulls + '?' + query, token)
              require(status, 200, existing)
              if existing:
                  pr = existing[0]
                  result.update(existing=True, number=pr['number'], url=pr['html_url'], state=pr['state'], draft=pr.get('draft'))
              else:
                  stage = 'verify_head'
                  status, source, _ = api('/repos/Kizuno18/sbxie/branches/' + urllib.parse.quote(branch, safe=''), token)
                  require(status, 200, source)
                  result['observed_head'] = source['commit']['sha']
                  if source['commit']['sha'] != result['expected_head']:
                      raise ValueError('Source changed after review')

                  stage = 'create_pr_with_pat'
                  payload = {'title': title, 'body': body, 'head': 'Kizuno18:' + branch,
                             'base': 'master', 'draft': True, 'maintainer_can_modify': True}
                  status, pr, headers = api(pulls, token, 'POST', payload)
                  result['accepted_permissions'] = next((v for k, v in headers.items() if k.lower() == 'x-accepted-github-permissions'), None)
                  require(status, 201, pr)
                  result.update(created=True, number=pr['number'], url=pr['html_url'], draft=pr['draft'])

                  stage = 'confirm_pr'
                  status, check, _ = api(pulls + '/' + str(pr['number']), token)
                  require(status, 200, check)
                  result['verified'] = (check['head']['sha'] == result['expected_head']
                      and check['head']['repo']['full_name'] == 'Kizuno18/sbxie'
                      and check['base']['repo']['full_name'] == 'sandboxie-plus/Sandboxie'
                      and check['base']['ref'] == 'master' and check['draft']
                      and check['title'] == title and check['body'] == body)
          except Exception as error:
              result.update(stage=stage, error_type=type(error).__name__)
          finally:
              key.unlink(missing_ok=True)
              token = None
              Path('ini-pr-outcome.json').write_text(json.dumps(result, indent=2) + '\n', encoding='utf-8')
              print(json.dumps(result, indent=2))
      - name: Remove disposable private key
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/ini-pr-key.pem"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ini-pr-outcome-${{ github.run_id }}
          path: ini-pr-outcome.json
          retention-days: 1
