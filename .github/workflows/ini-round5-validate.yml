name: Raw INI round 5 validation

on:
  push:
    branches: [work/ini-round5-validate-20260907]

permissions:
  contents: read

env:
  SOURCE_HEAD: d130a237

jobs:
  resolve:
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/ini-write-errors-20260907
          fetch-depth: 1
          persist-credentials: false
      - id: sha
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          case "$sha" in ${SOURCE_HEAD}*) ;; *) echo "branch head $sha is not $SOURCE_HEAD" >&2; exit 1;; esac
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  linux:
    needs: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        qt: [5, 6]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          path: source
          persist-credentials: false
      - run: python round5-validate.py verify ${{ needs.resolve.outputs.sha }}
      - name: Install Qt
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          if [ "${{ matrix.qt }}" = 5 ]; then sudo apt-get install -y qtbase5-dev; else sudo apt-get install -y qt6-base-dev; fi
      - name: Build and run the regression target
        run: |
          set -euo pipefail
          cmake -S source/SandboxiePlus/tests/ini-write -B tests-build -DCMAKE_BUILD_TYPE=Release -DQT_DIR=/usr/lib/x86_64-linux-gnu/cmake/Qt${{ matrix.qt }}
          cmake --build tests-build --parallel 2
          ctest --test-dir tests-build --output-on-failure | tee round8-results.txt
          grep -q '100% tests passed, 0 tests failed out of 44' round8-results.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: round8-qt${{ matrix.qt }}
          path: |
            round8-results.txt
            round8-manifest.txt
            tests-build/Testing/Temporary/LastTest.log
          retention-days: 14

  windows:
    needs: resolve
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          path: source
          persist-credentials: false
      - run: python round5-validate.py projects ${{ needs.resolve.outputs.sha }}
      - uses: microsoft/setup-msbuild@v3
      - name: Install the repository Qt and Jom packages
        working-directory: source
        shell: cmd
        run: |
          call SandboxiePlus\install_qt.cmd x64 build_qt6
          if errorlevel 1 exit /b 1
          call Installer\buildVariables.cmd build_qt6
          echo QT_TEST_PATH=%CD%\..\Qt\%qt_version%\msvc2022_64>>%GITHUB_ENV%
          call SandboxiePlus\install_jom.cmd
          if errorlevel 1 exit /b 1
      - name: Build the fixture executables
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          if errorlevel 1 exit /b 1
          for %%T in (ini_write_test raw_ini_test) do (
            pushd fixture-%%T
            "%QT_TEST_PATH%\bin\qmake.exe" fixture.pro
            if errorlevel 1 exit /b 1
            "%GITHUB_WORKSPACE%\Qt\Tools\QtCreator\bin\jom.exe" -j 2
            if errorlevel 1 exit /b 1
            popd
          )
      - name: Run every case declared by the CMake target
        shell: pwsh
        run: |
          $env:PATH = "$env:QT_TEST_PATH\bin;$env:PATH"
          $env:QT_QPA_PLATFORM = 'offscreen'
          $definition = Get-Content source/SandboxiePlus/tests/ini-write/CMakeLists.txt -Raw
          $groups = [regex]::Matches($definition, 'foreach\(case ([^\)]+)\)')
          if ($groups.Count -lt 2) { throw 'Unexpected regression target structure' }
          $count = 0
          for ($i = 0; $i -lt $groups.Count; $i++) {
            $target = if ($i -eq 0) { 'ini_write_test' } else { 'raw_ini_test' }
            foreach ($case in ($groups[$i].Groups[1].Value -split '\s+' | Where-Object { $_ -ne '' })) {
              & "./fixture-$target/$target.exe" $case | Tee-Object -FilePath round8-results.txt -Append
              if ($LASTEXITCODE -ne 0) { "FAIL: $case" | Tee-Object -FilePath round8-results.txt -Append; exit $LASTEXITCODE }
              "PASS: $case" | Tee-Object -FilePath round8-results.txt -Append
              $count++
            }
          }
          if ($count -ne 44) { throw "Incomplete test selection: $count" }
      - name: Build Win32 prerequisites
        working-directory: source
        shell: cmd
        run: msbuild /t:build Sandboxie\SandboxDll.sln /p:Configuration=SbieRelease /p:Platform=Win32 /maxcpucount:2 /verbosity:minimal
      - name: Build actual QSbieAPI and SandMan x64 components
        working-directory: source
        shell: cmd
        run: |
          call SandboxiePlus\qmake_plus.cmd x64 build_qt6
          if errorlevel 1 exit /b 1
          if not exist "%GITHUB_WORKSPACE%\source\SandboxiePlus\bin\x64\Release\QSbieAPI.dll" exit /b 1
          if not exist "%GITHUB_WORKSPACE%\source\SandboxiePlus\bin\x64\Release\SandMan.exe" exit /b 1
          certutil -hashfile "%GITHUB_WORKSPACE%\source\SandboxiePlus\bin\x64\Release\QSbieAPI.dll" SHA256 >> "%GITHUB_WORKSPACE%\round8-manifest.txt"
          certutil -hashfile "%GITHUB_WORKSPACE%\source\SandboxiePlus\bin\x64\Release\SandMan.exe" SHA256 >> "%GITHUB_WORKSPACE%\round8-manifest.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: round8-windows
          path: |
            round8-results.txt
            round8-manifest.txt
          retention-days: 14
