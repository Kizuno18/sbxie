name: Proxy tunnel validation

on:
  push:
    branches: [feature/native-proxy-tunnels-20260906]
    paths: ['.github/workflows/proxy-tunnels-validation.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: proxy-development-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: git archive --format=tar.gz --output=source.tar.gz HEAD
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: proxy-source-snapshot
          path: source.tar.gz
          retention-days: 1
  qt-development-tools:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Collect Debian Qt development packages for offline compilation
        run: |
          mkdir qt-dev
          docker run --rm -v "$PWD/qt-dev:/out" debian:trixie sh -ec 'apt-get update -qq; cd /out; apt-get download qtbase5-dev qtbase5-dev-tools qt5-qmake-bin libqt5test5t64'
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: qt-development-tools
          path: qt-dev/*.deb
          retention-days: 1
