name: Identity profile workbench

on:
  push:
    branches: [work/identity-profile-validation-20260906]
    paths: ['.github/workflows/identity-workbench.yml']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 47811e71d00367326bef81b5281ab036a4a479b5
          fetch-depth: 2
          persist-credentials: false
      - name: Verify the published diff and package review evidence
        shell: python
        run: |
          import hashlib
          import json
          import subprocess
          from pathlib import Path
          expected = {
              'CHANGELOG.md',
              'Sandboxie/core/dll/kernel.c',
              'Sandboxie/install/SbieSettings.ini',
              'Sandboxie/core/dll/tests/CMakeLists.txt',
              'Sandboxie/core/dll/tests/README.md',
              'Sandboxie/core/dll/tests/generate_identity_fixture.py',
              'Sandboxie/core/dll/tests/kernel_identity_test.c',
          }
          parent = subprocess.check_output(['git', 'rev-parse', 'HEAD^']).decode().strip()
          if parent != '487d56309fafe90e2771d4c9004333fe01b77094':
              raise SystemExit('Unexpected contribution parent')
          paths = subprocess.check_output(['git', 'diff', '--name-only', 'HEAD^', 'HEAD']).decode().splitlines()
          if set(paths) != expected:
              raise SystemExit('Unexpected contribution paths')
          subprocess.run(['git', 'diff', '--check', 'HEAD^', 'HEAD'], check=True)
          patch = subprocess.check_output(['git', 'diff', '--full-index', 'HEAD^', 'HEAD'])
          Path('reviewed-volume-serial.patch').write_bytes(patch)
          manifest = {
              'commit': '47811e71d00367326bef81b5281ab036a4a479b5',
              'parent': parent,
              'patch_sha256': hashlib.sha256(patch).hexdigest(),
              'files': {path: subprocess.check_output(['git', 'rev-parse', 'HEAD:' + path]).decode().strip() for path in paths},
          }
          Path('reviewed-volume-manifest.json').write_text(json.dumps(manifest, indent=2))
          print(json.dumps(manifest, indent=2))
      - name: Run the portable fixtures
        shell: bash
        run: |
          set -euo pipefail
          cmake -S Sandboxie/core/dll/tests -B "$RUNNER_TEMP/tests" -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/tests" --parallel 2
          ctest --test-dir "$RUNNER_TEMP/tests" --output-on-failure | tee reviewed-volume-linux-tests.txt
      - uses: actions/upload-artifact@v4
        with:
          name: reviewed-volume-source
          path: reviewed-volume-*
          retention-days: 7

  windows-fixtures:
    runs-on: windows-2022
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        architecture: [Win32, x64]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 47811e71d00367326bef81b5281ab036a4a479b5
          persist-credentials: false
      - name: Configure the synthetic fixtures
        run: cmake -S Sandboxie/core/dll/tests -B fixture-build -G "Visual Studio 17 2022" -A ${{ matrix.architecture }}
      - name: Compile the fixtures
        run: cmake --build fixture-build --config Release --parallel 2
      - name: Run the fixtures without loading Sandboxie
        run: ctest --test-dir fixture-build -C Release --output-on-failure

  core-build:
    runs-on: windows-2022
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        architecture: [Win32, x64, ARM64, ARM64EC]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 47811e71d00367326bef81b5281ab036a4a479b5
          persist-credentials: false
      - uses: microsoft/setup-msbuild@v3
      - name: Build Win32 first for message generation and embedded low-level resources
        shell: cmd
        run: msbuild /t:build Sandboxie\SandboxDll.sln /p:Configuration=SbieRelease /p:Platform=Win32 /maxcpucount:2 /verbosity:minimal
      - name: Build the target DLL and service solution without running it
        if: matrix.architecture != 'Win32'
        shell: cmd
        run: msbuild /t:build Sandboxie\SandboxDll.sln /p:Configuration=SbieRelease /p:Platform=${{ matrix.architecture }} /maxcpucount:2 /verbosity:minimal
