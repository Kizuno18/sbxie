name: Identity profile workbench

on:
  push:
    branches: [work/identity-profile-validation-20260906]
    paths: ['.github/workflows/identity-workbench.yml', 'ini-workbench.py', 'ini-write-errors.patch.xz.b64']

permissions:
  contents: read

concurrency:
  group: identity-ini-write-review
  cancel-in-progress: false

env:
  SOURCE_BASE: 487d56309fafe90e2771d4c9004333fe01b77094

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        qt: [5, 6]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SOURCE_BASE }}
          path: source
          persist-credentials: false
      - name: Verify and apply the reviewed contribution
        run: python ini-workbench.py source
      - name: Install the Qt test dependency
        shell: bash
        env:
          QT_MAJOR: ${{ matrix.qt }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          if [ "$QT_MAJOR" = 5 ]; then
            sudo apt-get install -y qtbase5-dev
          else
            sudo apt-get install -y qt6-base-dev
          fi
      - name: Build and run all ten regression cases
        shell: bash
        env:
          QT_MAJOR: ${{ matrix.qt }}
        run: |
          set -euo pipefail
          cmake -S source/SandboxiePlus/tests/ini-write -B fixture-build -DCMAKE_BUILD_TYPE=Release "-DQT_DIR=/usr/lib/x86_64-linux-gnu/cmake/Qt$QT_MAJOR"
          cmake --build fixture-build --parallel 2
          ctest --test-dir fixture-build --output-on-failure | tee ini-results.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ini-write-linux-qt${{ matrix.qt }}
          path: |
            ini-results.txt
            fixture-build/Testing/Temporary/LastTest.log
            fixture-build/CMakeCache.txt
          retention-days: 7

  windows:
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SOURCE_BASE }}
          path: source
          persist-credentials: false
      - name: Verify and apply the reviewed contribution
        run: python ini-workbench.py source
      - uses: microsoft/setup-msbuild@v3
      - name: Install the repository-pinned Qt package
        working-directory: source
        shell: cmd
        run: |
          call SandboxiePlus\install_qt.cmd x64 build_qt6
          if errorlevel 1 exit /b 1
          call Installer\buildVariables.cmd build_qt6
          echo QT_TEST_PATH=%CD%\..\Qt\%qt_version%\msvc2022_64>>%GITHUB_ENV%
      - name: Install Jom using the repository script
        working-directory: source
        shell: cmd
        run: SandboxiePlus\install_jom.cmd
      - name: Build the Windows fixtures with the release-only Qt package
        shell: cmd
        run: |
          python source\SandboxiePlus\tests\ini-write\generate_fixture.py fixture-build
          if errorlevel 1 exit /b 1
          >fixture-build\fixture.pro echo TEMPLATE = app
          >>fixture-build\fixture.pro echo TARGET = ini_write_test
          >>fixture-build\fixture.pro echo QT += widgets
          >>fixture-build\fixture.pro echo CONFIG += console c++17 release
          >>fixture-build\fixture.pro echo CONFIG -= debug debug_and_release app_bundle
          >>fixture-build\fixture.pro echo DESTDIR = .
          >>fixture-build\fixture.pro echo INCLUDEPATH += .
          >>fixture-build\fixture.pro echo SOURCES += ../source/SandboxiePlus/tests/ini-write/ini_write_test.cpp
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          if errorlevel 1 exit /b 1
          cd fixture-build
          "%QT_TEST_PATH%\bin\qmake.exe" -v
          "%QT_TEST_PATH%\bin\qmake.exe" fixture.pro
          if errorlevel 1 exit /b 1
          "%GITHUB_WORKSPACE%\Qt\Tools\QtCreator\bin\jom.exe" -j 2
          if errorlevel 1 exit /b 1
      - name: Execute all ten Windows regression cases
        shell: pwsh
        run: |
          $env:PATH = "$env:QT_TEST_PATH\bin;$env:PATH"
          $env:QT_QPA_PLATFORM = 'offscreen'
          $cases = @('list-delete','list-append','list-retry','list-noop','bool-delete','bool-success','checkbox-delete','options-failure','options-success','options-reported-failure')
          foreach ($case in $cases) {
            & ./fixture-build/ini_write_test.exe $case | Tee-Object -FilePath ini-results.txt -Append
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Build the existing Win32 prerequisites
        working-directory: source
        shell: cmd
        run: msbuild /t:build Sandboxie\SandboxDll.sln /p:Configuration=SbieRelease /p:Platform=Win32 /maxcpucount:2 /verbosity:minimal
      - name: Build the actual QSbieAPI and SandMan x64 components
        working-directory: source
        shell: cmd
        run: |
          call SandboxiePlus\qmake_plus.cmd x64 build_qt6
          if errorlevel 1 exit /b 1
          if not exist "%GITHUB_WORKSPACE%\source\SandboxiePlus\bin\x64\Release\QSbieAPI.dll" exit /b 1
          if not exist "%GITHUB_WORKSPACE%\source\SandboxiePlus\bin\x64\Release\SandMan.exe" exit /b 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ini-write-windows-x64
          path: |
            ini-results.txt
            fixture-build/fixture.pro
          retention-days: 7

  publish:
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Publish the validated contribution without rewriting history
        run: python ini-workbench.py publish
