name: Identity profile workbench

on:
  push:
    branches: [work/identity-profile-validation-20260906]

permissions:
  contents: read

jobs:
  tools:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Install the standalone Qt test toolchain
        run: sudo apt-get update -qq && sudo apt-get install -y qtbase5-dev
      - name: Package headers and test tools
        shell: python
        run: |
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          roots = [(Path('/usr/include/x86_64-linux-gnu/qt5'), 'include'), (Path('/usr/lib/qt5/bin'), 'bin'), (Path('/usr/lib/x86_64-linux-gnu/qt5/mkspecs'), 'mkspecs')]
          with ZipFile('qt-profile-tools.zip', 'w', ZIP_DEFLATED) as out:
              for root, prefix in roots:
                  for path in root.rglob('*'):
                      if path.is_file():
                          out.write(path, str(Path(prefix) / path.relative_to(root)))
              for path in Path('/usr/lib/x86_64-linux-gnu').glob('libQt5Test.so*'):
                  out.write(path, 'lib/' + path.name)
      - uses: actions/upload-artifact@v4
        with:
          name: qt-profile-tools
          path: qt-profile-tools.zip
          retention-days: 1
